name: Release

# Fires only on semver tags — never on branch pushes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Deny all permissions at the top level — each job grants only what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── build: compile release binaries for all targets ──────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8c48c87ab7c9e6ff3f4e4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.8

      # Install cross for Linux aarch64 cross-compilation
      - name: Install cross (aarch64-linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --locked

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --bin talon --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --bin talon --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: talon-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/talon${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
          retention-days: 1

  # ── sign-and-attest: cosign + SHA256SUMS + SLSA provenance ───────────────────
  sign-and-attest:
    name: Sign and attest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # write release assets
      id-token: write       # OIDC token for cosign keyless signing
      attestations: write   # SLSA provenance attestation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts/ -type f -exec mv {} dist/ \;

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e08fe6e5e4e2b3f8b9c1a14c6b7a85 # v3.8.0

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Sign binaries and SHA256SUMS (keyless via GitHub OIDC)
        run: |
          for f in dist/*; do
            cosign sign-blob \
              --yes \
              --oidc-issuer=https://token.actions.githubusercontent.com \
              --output-signature="${f}.sig" \
              --output-certificate="${f}.pem" \
              "$f"
          done

      - name: SLSA L2 provenance attestation
        uses: actions/attest-build-provenance@db580d3e5cce7c3d1d5adcb59576c1c8fe7d0b7e # v2.3.0
        with:
          subject-path: dist/*

      - name: Upload signed dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-signed
          path: dist/
          retention-days: 1

  # ── github-release: create GitHub Release with auto-generated notes ───────────
  github-release:
    name: GitHub Release
    needs: sign-and-attest
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create release + upload assets
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # git-cliff needs full history

      - name: Download signed dist
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: dist-signed
          path: dist/

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate release notes
        run: git cliff --latest --output RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  # ── publish-crates: crates.io trusted publishing (no stored token) ───────────
  publish-crates:
    name: Publish to crates.io
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for crates.io trusted publishing
    environment: crates-io   # requires manual approval gate in GitHub UI
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8c48c87ab7c9e6ff3f4e4 # stable
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.8

      # Publish in dependency order — each must land before the next can resolve it.
      - run: cargo publish -p talon-core  --no-verify
      - run: sleep 20
      - run: cargo publish -p talon-llm  --no-verify
      - run: sleep 20
      - run: cargo publish -p talon-memory --no-verify
      - run: sleep 20
      - run: cargo publish -p talon-tools  --no-verify
      - run: sleep 20
      - run: cargo publish -p talon-gateway --no-verify
      - run: sleep 20
      - run: cargo publish -p talon-plugins --no-verify

  # ── docker-publish: multi-arch image, signed with cosign ─────────────────────
  docker-publish:
    name: Docker publish
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for Docker Hub + cosign
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@b5730b3a3b74e5d40e3f26e5a89e0a44dd16b26e # v3.10.0

      - name: Log in to Docker Hub (OIDC)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbea8a09e9268b9ef7875e2f1b2e # v5.7.0
        with:
          images: rohirikman/talon
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e08fe6e5e4e2b3f8b9c1a14c6b7a85 # v3.8.0

      - name: Sign Docker image (keyless via GitHub OIDC)
        run: |
          cosign sign --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            "${{ steps.push.outputs.digest }}"
