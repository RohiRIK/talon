version: 2
updates:
  # Rust / Cargo dependency bumps
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    labels:
      - deps
    open-pull-requests-limit: 10
    ignore:
      # keyring v4 is a ground-up rewrite; upstream explicitly says do NOT
      # upgrade existing v3 apps (use keyring-core instead). Stay on v3 until
      # a deliberate keyring-core migration. See PR #10.
      - dependency-name: "keyring"
        update-types: ["version-update:semver-major"]
    groups:
      # Group all patch-level Rust dep bumps into one PR
      patch-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions SHA bumps
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    labels:
      - deps
    open-pull-requests-limit: 5
