[workspace]
members = [
    "talon",
    "crates/talon-core",
    "crates/talon-llm",
    "crates/talon-memory",
    "crates/talon-tools",
    "crates/talon-gateway",
    "crates/talon-plugins",
    "crates/talon-secrets",
]
resolver = "2"

[workspace.package]
version      = "0.2.0"
edition      = "2024"
authors      = ["Rohi Rikman <rohi5054@gmail.com>"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/rohirikman/talon"
rust-version = "1.88"

# ---------------------------------------------------------------------------
# Shared dependencies — all crates inherit from here.
# Pin minor versions; Dependabot will bump SHAs weekly.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Async runtime
tokio            = { version = "1",    features = ["full"] }
tokio-stream     = "0.1"
tokio-util       = { version = "0.7", features = ["rt"] }
futures          = "0.3"

# Serialization
serde            = { version = "1",    features = ["derive"] }
serde_json       = "1"

# HTTP
reqwest          = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Web framework
axum             = "0.8"
# Embedded web console assets (web-ui feature) — web/dist compiled into the binary
rust-embed       = "8"

# Database — SQLite (bundled, FTS5 via vtab feature)
rusqlite         = { version = "0.32", features = ["bundled", "vtab"] }
deadpool-sqlite  = "0.9"

# Memory — vectors live in SQLite via sqlite-vec (ADR 0008). zerocopy serializes
# &[f32] → blobs for the vec0 virtual table.
sqlite-vec       = "0.1"
zerocopy         = "0.8"

# TUI
ratatui          = "0.30"
crossterm        = "0.29"

# Telegram
teloxide         = { version = "0.17", features = ["macros"] }

# CLI
clap             = { version = "4",    features = ["derive"] }

# WASM plugin host (Phase 6, feature-flagged)
# wasmtime + wasmtime-wasi release in lockstep — keep versions equal. The `wasm`
# feature requires rustc ≥ 1.93 (wasmtime 45 MSRV); the rest of the workspace
# keeps its 1.88 promise since these are pulled only under that opt-in feature.
wasmtime         = "45"
wasmtime-wasi    = "45"
notify           = "8"

# OS keychain
keyring          = "3"

# Builtin vault crypto (talon-secrets) — audited RustCrypto crates
aes-gcm          = "0.10"
argon2           = "0.5"
base64           = "0.22"
sha2             = "0.10"
hmac             = "0.12"

# Error handling
thiserror        = "2"
anyhow           = "1"

# Observability
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender     = "0.2"
# Metrics facade — recorder-less calls are no-ops; the Prometheus recorder is
# installed only by `talon serve` (web console /metrics).
metrics                      = "0.24"
metrics-exporter-prometheus  = { version = "0.16", default-features = false }

# Identifiers + time
uuid       = { version = "1", features = ["v4"] }
chrono     = { version = "0.4", features = ["serde"] }
chrono-tz  = "0.10"

# Cron parsing / next-occurrence (scheduler engine — SQLite is source of truth)
croner     = "3"

# Phase 4 — Gateway
# Input editing is hand-rolled (crates/talon-gateway/src/tui/components/input.rs);
# tui-textarea was dropped because it lags ratatui releases (no 0.30 support).
# default-features=false drops `chafa-dyn`, which needs the `chafa` C system lib.
ratatui-image        = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
comrak               = "0.28"
syntect              = "5"
similar              = "2"
indicatif            = "0.17"
inquire              = "0.7"
strip-ansi-escapes   = "0.2"
unicode-width        = "0.2"

# NOTE: async-trait is intentionally absent — edition 2024 has native async fn in traits.
