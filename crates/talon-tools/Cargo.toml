[package]
name        = "talon-tools"
description = "Built-in tools: file I/O, terminal sandbox, web, MCP adapter, session search."
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true

[dependencies]
talon-core.path   = "../talon-core"
talon-memory.path = "../talon-memory"

tokio.workspace      = true
serde.workspace      = true
serde_json.workspace = true
reqwest.workspace    = true
thiserror.workspace  = true
tracing.workspace    = true

globset  = "0.4"
regex    = "1"
walkdir  = "2"
tempfile = "3"

# Web tools (Phase 5): readable-text extraction (Readability port).
dom_smoothie = "0.17"
# MCP config (Phase 5): ~/.talon/mcp_servers.toml
toml = "0.8"

# Browser tool (Phase 5, experimental): headless Chrome via CDP. Off by default.
[dependencies.headless_chrome]
version  = "1"
optional = true

[features]
# Experimental browser automation. Needs a Chrome binary at runtime.
browser = ["dep:headless_chrome"]

[dev-dependencies]
wiremock = "0.6"
tokio    = { workspace = true, features = ["macros", "rt-multi-thread"] }
