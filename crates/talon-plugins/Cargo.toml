[package]
name        = "talon-plugins"
description = "Talon WASM plugin host — wasmtime + WASI preview2, hot-reload, capability gating."
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true

[dependencies]
talon-core.path   = "../talon-core"

tokio.workspace      = true
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
tracing.workspace    = true
anyhow.workspace     = true
toml                 = "0.8"

[dependencies.wasmtime]
workspace = true
optional  = true

[dependencies.wasmtime-wasi]
workspace = true
optional  = true

[dependencies.notify]
workspace = true
optional  = true

[dev-dependencies]
tempfile = "3"

[features]
# WASM host is opt-in: pulls wasmtime (15–22 MB) + WASI + a filesystem watcher.
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:notify"]
