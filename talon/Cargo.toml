[package]
name        = "talon"
description = "Single-binary AI agent — persistent memory, multi-channel, WASM plugins."
keywords    = ["ai", "agent", "llm", "memory", "cli"]
categories  = ["command-line-utilities"]
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
rust-version.workspace = true

[[bin]]
name = "talon"
path = "src/main.rs"

[dependencies]
talon-core    = { path = "../crates/talon-core" }
talon-llm     = { path = "../crates/talon-llm", features = ["github-copilot-provider"] }
talon-memory  = { path = "../crates/talon-memory" }
talon-gateway = { path = "../crates/talon-gateway" }
talon-tools   = { path = "../crates/talon-tools" }
talon-secrets = { path = "../crates/talon-secrets" }
talon-plugins = { path = "../crates/talon-plugins", optional = true }

tokio.workspace              = true
tokio-util.workspace         = true
tracing.workspace            = true
tracing-subscriber.workspace = true
clap.workspace               = true
anyhow.workspace             = true
keyring.workspace            = true
serde_json.workspace         = true
uuid.workspace               = true
chrono.workspace             = true
inquire.workspace            = true
toml                         = "0.8"

[features]
telegram = ["talon-gateway/telegram"]
browser  = ["talon-tools/browser"]
# WASM skills loaded from ~/.talon/skills/ at startup. Opt-in: pulls wasmtime
# (15–22 MB). Default builds stay lean and skip the plugin host entirely.
skills   = ["dep:talon-plugins", "talon-plugins/wasm"]
# Web console SPA embedded into the binary (committed web/dist via rust-embed
# in talon-gateway), served by `talon serve` at /ui. Default builds stay lean.
web-ui   = ["talon-gateway/web-ui"]
# External secret providers — read-only, config-gated at runtime, feature-gated
# at compile time. Default builds compile neither.
vault       = ["talon-secrets/vault"]
aws-secrets = ["talon-secrets/aws-secrets"]

[dev-dependencies]
tempfile = "3"
